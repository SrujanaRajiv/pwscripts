name: Contact Us Playwright

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # Run manually from the Actions tab

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ContactUs-Automation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ContactUs-Automation/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            ContactUs-Automation/playwright-report/
            ContactUs-Automation/test-results/
